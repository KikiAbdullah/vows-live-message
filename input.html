<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Live Message</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="container center-screen">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Form Container -->
                <div class="glass-form-container text-center">
                    <img src="assets/logo.png" alt="VOWS" class="logo mx-auto mb-3" style="max-width: 180px;">
                    <h2 class="glow-text mb-4 custom-web-title" style="font-size: 1.5rem;">Send a Message</h2>
                    
                    <div class="emoji-reaction-container d-flex justify-content-center gap-3 mb-4">
                        <button type="button" class="btn btn-outline-light fs-3 emoji-btn" data-emoji="❤️">❤️</button>
                        <button type="button" class="btn btn-outline-light fs-3 emoji-btn" data-emoji="🔥">🔥</button>
                        <button type="button" class="btn btn-outline-light fs-3 emoji-btn" data-emoji="💦">💦</button>
                        <button type="button" class="btn btn-outline-light fs-3 emoji-btn" data-emoji="🎉">🎉</button>
                    </div>

                    <form id="messageForm">
                        <div class="mb-4 text-start">
                            <label for="userName" class="form-label text-white-50">Your Name (Max 20 chars)</label>
                            <input type="text" class="form-control custom-input" id="userName" placeholder="Your Name" required autocomplete="off" maxlength="20">
                        </div>
                        <div class="mb-4 text-start">
                            <label for="userMessage" class="form-label text-white-50 d-flex justify-content-between">
                                <span>Message</span>
                                <span id="charCounter" style="font-size: 0.8rem;">0/200</span>
                            </label>
                            <textarea class="form-control custom-textarea" id="userMessage" rows="4" placeholder="Shoutout to the front row..." required autocomplete="off" maxlength="200"></textarea>
                        </div>
                        <button type="submit" class="neon-btn w-100 mt-2" id="submitBtn">SEND MESSAGE</button>
                    </form>
                    <div id="statusAlert" class="mt-3" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
