<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VOWS Live Message Board — Real-time interactive chat display for events" />
    <meta name="theme-color" content="#000000" />
    <title>Live Message Board</title>

    <!-- DNS Prefetch for external domains -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  </head>
  <body>
    <div id="emojiRainContainer"></div>
    <div class="scanline"></div>
    <main class="container-fluid py-4">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-7 left-display">
          <!-- Top Header: Logo -->
          <div class="d-flex justify-content-center align-items-center mb-4">
            <div class="logo-container">
              <img src="assets/logo.png" alt="VOWS" class="logo" loading="eager" />
            </div>
          </div>

          <!-- Big Chat Display -->
          <div class="new-chat"></div>

          <!-- Sponsor Slideshow -->
          <div
            class="sponsor-banner"
            id="sponsorBanner"
            style="display: none"
          >
            <div class="sponsor-track" id="sponsorTrack">
              <!-- Logos injected by JS -->
            </div>
          </div>
        </div>
        <aside class="col-lg-4 col-md-5 right-chat">
          <h1 class="glow-text display-3 custom-web-title">LIVE CHAT</h1>
           
          <div class="chat-container" id="chatContainer">
            <!-- Messages will be injected here via JavaScript -->
          </div>
           <div class="qr-section">
                <a href="input.html" target="_blank" rel="noopener" style="text-decoration: none; display: inline-block;">
                  <div id="qrcode"></div>
                </a>
              <div class="qr-text">
                <span class="scan-now">SCAN TO CHAT</span>
                <span class="url-hint">SEND YOUR MOST ICONIC MESSAGE ✨</span>
              </div>
            </div>
        </aside>
      </div>
    </main>

    <!-- App Logic -->
    <script src="app.js" defer></script>
  </body>
</html>
