<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Message Board</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div id="emojiRainContainer"></div>
    <div class="scanline"></div>
    <div class="container-fluid py-4">
      <div class="row justify-content-center">
        <div class="col-md-8 left-display">
          <!-- Top Header: Logo + QR -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="logo-container">
              <img src="assets/logo.jpg" alt="VOWS" class="logo" />
            </div>

               <div class="qr-section">
              <div id="qrcode"></div>
              <div class="qr-text">
                <span class="scan-now">SCAN TO CHAT</span>
                <span class="url-hint">OPEN ON YOUR MOBILE</span>
              </div>
            </div>
          </div>

          <!-- Big Chat Display -->
          <div class="new-chat"></div>

          <!-- Sponsor Slideshow -->
          <div
            class="sponsor-banner mt-4"
            id="sponsorBanner"
            style="display: none"
          >
            <div class="sponsor-track" id="sponsorTrack">
              <!-- Logos injected by JS -->
            </div>
          </div>
        </div>
        <div class="col-md-4 right-chat">
          <h1 class="glow-text display-3 mb-5 custom-web-title">LIVE CHAT</h1>
          <div class="chat-container" id="chatContainer">
            <!-- Messages will be injected here via JavaScript -->
          </div>
        </div>
      </div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
  </body>
</html>
