<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOWS - Live Settings</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase App -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="scanline"></div>
    <!-- Back to Index Button -->
    <div style="position: absolute; top: 20px; left: 20px; z-index: 1000;">
        <a href="index.html" class="export-btn" style="text-decoration: none;">&larr; Back to Live View</a>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <!-- Settings Container -->
                <div class="glass-form-container">
                    <div class="text-center mb-5">
                        <img id="previewLogo" src="assets/logo.jpg" alt="Logo Preview" class="logo mx-auto mb-3" style="max-width: 150px;">
                        <h2 class="glow-text custom-web-title" style="font-size: 2rem;">Admin Settings</h2>
                        <p class="text-white-50">Changes apply to all devices instantly.</p>
                    </div>

                    <form id="settingsForm">
                        <div class="row">
                            <!-- Colors Column -->
                            <div class="col-md-6 mb-4">
                                <h5 class="text-white mb-3">🎨 Theme Options</h5>
                                
                                <div class="mb-3">
                                    <label class="form-label text-white-50 font-weight-bold">Primary Theme Color</label>
                                    <div class="d-flex align-items-center gap-3">
                                        <input type="color" class="form-control form-control-color bg-transparent border-0 p-1" id="primaryColor" value="#ff0000">
                                        <span class="text-white colorHexText">#ff0000</span>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label text-white-50 font-weight-bold">Secondary Theme Color (Gradients)</label>
                                    <div class="d-flex align-items-center gap-3">
                                        <input type="color" class="form-control form-control-color bg-transparent border-0 p-1" id="secondaryColor" value="#4a0000">
                                        <span class="text-white colorHexText">#4a0000</span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-white-50 font-weight-bold">Background Color</label>
                                    <div class="d-flex align-items-center gap-3">
                                        <input type="color" class="form-control form-control-color bg-transparent border-0 p-1" id="bgColor" value="#000000">
                                        <span class="text-white colorHexText">#000000</span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-white-50 font-weight-bold">Font Color</label>
                                    <div class="d-flex align-items-center gap-3">
                                        <input type="color" class="form-control form-control-color bg-transparent border-0 p-1" id="fontColor" value="#ffffff">
                                        <span class="text-white colorHexText">#ffffff</span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Texts & Timers Column -->
                            <div class="col-md-6 mb-4">
                                <h5 class="text-white mb-3">⚙️ Preferences</h5>

                                <div class="mb-4">
                                    <label for="webTitle" class="form-label text-white-50 font-weight-bold">Web Title</label>
                                    <input type="text" class="form-control custom-input" id="webTitle" placeholder="LIVE CHAT">
                                </div>

                                <div class="mb-4">
                                    <label for="msgInterval" class="form-label text-white-50 font-weight-bold">Message Interval (Seconds)</label>
                                    <input type="number" class="form-control custom-input" id="msgInterval" min="0.5" max="10" step="0.5" value="3" placeholder="3">
                                    <small class="text-white-50">Time gap between new messages popping up.</small>
                                </div>

                                <div class="mb-4">
                                    <label for="logoImage" class="form-label text-white-50 font-weight-bold">Upload Logo (Max 1MB)</label>
                                    <input class="form-control custom-input" type="file" id="logoImage" accept="image/png, image/jpeg, image/gif">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="neon-btn w-100 mt-2" id="saveSettingsBtn">SAVE ALL SETTINGS</button>
                    </form>
                    
                    <div id="settingsAlert" class="mt-4 text-center" style="display: none; font-weight: 700;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Logic -->
    <script src="app.js"></script>
</body>
</html>
